    const container = document.getElementById('eventsContainer');
    const searchKey = document.getElementById('searchKey');
    const filterMonth = document.getElementById('filterMonth');
    const filterDate = document.getElementById('filterDate');
    const filterVenue = document.getElementById('filterVenue');
    const counterText = document.getElementById('counterText');
    const resetBtn = document.getElementById('resetFilters');

    function makeCalendarLink(ev) {
        const cleanDate = ev.dateStr.replace(/-/g, '');
        const startDateTime = cleanDate + "T" + ev.time.replace(':', '') + "00";
        let endHour = parseInt(ev.time.split(':')[0]) + 3;
        if (endHour >= 24) endHour = 23;
        const endDateTime = cleanDate + "T" + String(endHour).padStart(2, '0') + ev.time.split(':')[1] + "00";
        return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(ev.title)}&dates=${startDateTime}/${endDateTime}&details=${encodeURIComponent(ev.description + ' - Guide curated by Diamante del Mar.')}&location=${encodeURIComponent(ev.venue)}`;
    }

    function makeWhatsAppLink(ev) {
        const shareText = `✨ *${ev.title}* ✨\n📅 Date: ${ev.displayDate.day} ${ev.displayDate.month} 2026 at ${ev.time}\n📍 Venue: ${ev.venue}\n🗺️ Google Maps Location: ${ev.mapsLink}\n\nShared via Diamante del Mar Luxury Guide!`;
        return `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
    }

    function renderEvents() {
        const searchVal = searchKey.value.toLowerCase();
        const monthVal = filterMonth.value;
        const dateVal = filterDate.value;
        const venueVal = filterVenue.value;

        const filtered = eventsData.filter(ev => {
            const matchesSearch = ev.title.toLowerCase().includes(searchVal) || ev.description.toLowerCase().includes(searchVal) || ev.venue.toLowerCase().includes(searchVal);
            const matchesMonth = monthVal ? ev.dateStr.split('-')[1] === monthVal : true;
            const matchesDate = dateVal ? ev.dateStr === dateVal : true;
            const matchesVenue = venueVal ? (ev.venueTag === venueVal || ev.venue.includes(venueVal)) : true;
            return matchesSearch && matchesMonth && matchesDate && matchesVenue;
        });

        container.innerHTML = '';

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="no-events">
                    <i class="fa-solid fa-calendar-xmark" style="font-size: 3rem; color: var(--accent-gold); margin-bottom: 15px;"></i>
                    <h3>No Matching Events Found</h3>
                    <p>Try resetting the search filters to display the full calendar itinerary.</p>
                </div>`;
            counterText.innerText = "No events match your criteria.";
            return;
        }

        counterText.innerText = `Displaying ${filtered.length} curated event${filtered.length > 1 ? 's' : ''} for your stay`;

        filtered.forEach(ev => {
            const card = document.createElement('div');
            card.className = 'event-card';
            card.innerHTML = `
                <div class="event-date-block">
                    <span class="date-day">${ev.displayDate.day}</span>
                    <span class="date-month">${ev.displayDate.month}</span>
                    <span class="date-weekday">${ev.displayDate.weekday}</span>
                </div>
                <div class="event-content">
                    <h3 class="event-title">${ev.title}</h3>
                    <p class="event-description">${ev.description}</p>
                    <div class="event-meta-info">
                        <div class="meta-item"><i class="fa-regular fa-clock"></i> <strong>Time:</strong> ${ev.time}</div>
                        <div class="meta-item"><i class="fa-solid fa-location-dot"></i> <strong>Venue:</strong> ${ev.venue}</div>
                    </div>
                </div>
                <div class="event-actions">
                    <a href="${ev.mapsLink}" target="_blank" class="btn-action btn-maps">
                        <i class="fa-solid fa-map-location-dot"></i> Google Maps
                    </a>
                    <a href="${makeCalendarLink(ev)}" target="_blank" class="btn-action btn-calendar">
                        <i class="fa-regular fa-calendar-plus"></i> Add to Calendar
                    </a>
                    <a href="${makeWhatsAppLink(ev)}" target="_blank" class="btn-action btn-share">
                        <i class="fa-brands fa-whatsapp"></i> WhatsApp Share
                    </a>
                </div>`;
            container.appendChild(card);
        });
    }

    searchKey.addEventListener('input', renderEvents);
    filterMonth.addEventListener('change', renderEvents);
    filterDate.addEventListener('change', () => { if (filterDate.value) filterMonth.value = ""; renderEvents(); });
    filterVenue.addEventListener('change', renderEvents);
    resetBtn.addEventListener('click', () => { searchKey.value = ""; filterMonth.value = ""; filterDate.value = ""; filterVenue.value = ""; renderEvents(); });

    renderEvents();
</script>
