<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan for Exclusive Tours | Diamante del mar Kos</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #faf8f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .card {
            background: white;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 450px;
            width: 90%;
            border-top: 6px solid #e8a365;
        }
        .logo {
            max-width: 250px;
            margin-bottom: 20px;
        }
        h1 {
            color: #0f2c59;
            font-size: 26px;
            margin-bottom: 10px;
            margin-top: 0;
        }
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .qr-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            border: 2px dashed #dcdcdc;
            margin-bottom: 20px;
        }
        .qr-code {
            width: 220px;
            height: 220px;
            display: block;
        }
        .footer-text {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            margin-bottom: 0;
        }
        .hotel-name {
            font-weight: bold;
            color: #0f2c59;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://vibesandview.gr/wp-content/uploads/2026/04/LOGO-Vibes-and-View-01-scaled-e1775846360389.png" alt="Vibes and View Logo" class="logo">
        
        <h1>Welcome to<br><span class="hotel-name">Diamante del mar Kos</span></h1>
        <img src="https://www.diamantedelmar.gr/diamante-del-mar-horizontal-logo.jpg" alt="Diamante del mar logo" class="logo">
        <p>Enhance your stay in Kos! Scan the QR code below to unlock exclusive, tailor-made experiences and private tours designed just for our guests.</p>
        
        <div class="qr-container">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://www.diamantedelmar.gr/experience/vibes-kos.html" alt="QR Code to Experiences" class="qr-code">
        </div>
        
        <p class="footer-text">Open your phone's camera and point it at the code to view the guide.</p>
    </div>
</body>
</html>
